appId: com.altixcode.voicecrisp
name: Clean a recording end to end (Android)
---
# The fixture is a 4.4s take that is deliberately wrong in three ways: recorded
# about 20 dB too quietly, with 42 Hz rumble underneath and a boxy 250 Hz
# resonance on top. A clean recording would let every assertion pass on a file
# that was already fine.
# Same contract as the iOS flow against a different engine: MediaCodec decodes
# and encodes here, not AVAssetReader and AVAssetWriter. One passing says
# nothing about the other, so both are gated by reading the exported file back.
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: artifacts/android-01-home

- tapOn: "Choose a Recording"
# Anchored on the storage picker's own chrome. "Show roots" is the one thing
# present in every state of it -- the picker reopens wherever it was last left,
# so waiting for "Recent" only describes the first run.
- extendedWaitUntil:
    visible: "Show roots"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 6000

# Navigation is conditional on the file not already being in view, because it
# usually is: a file pushed with adb never appears under Recent, so the first
# run walks to it and every run after that reopens there.
- runFlow:
    when:
      notVisible: "voicecrisp-rough.wav"
    commands:
      - tapOn: "Show roots"
      - waitForAnimationToEnd:
          timeout: 4000
      - tapOn: ".*(Downloads|Internal storage|Pixel).*"
      - waitForAnimationToEnd:
          timeout: 4000
      - runFlow:
          when:
            visible: "voicecrisp-qa"
          commands:
            - tapOn: "voicecrisp-qa"
            - waitForAnimationToEnd:
                timeout: 4000

# List view, because in grid view the only element carrying the filename is the
# card's expand button -- "Preview the file ..." -- so matching on the name
# opens an inline player instead of selecting the file, and the flow carries on
# having chosen nothing.
- runFlow:
    when:
      visible: "List view"
    commands:
      - tapOn: "List view"
      - waitForAnimationToEnd:
          timeout: 4000
- takeScreenshot: artifacts/android-02-files
- tapOn: "voicecrisp-rough.wav"

# The loaded file's own sample rate, which also proves decode read the format
# rather than assuming one.
- extendedWaitUntil:
    visible: ".*48 kHz.*"
    timeout: 45000
- takeScreenshot: artifacts/android-02-loaded

- tapOn: "Clean It Up"
# The report only renders once a result exists, so this is the assertion that
# the chain ran and the encoder wrote a file.
- extendedWaitUntil:
    visible: "What Changed"
    timeout: 300000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: artifacts/android-03-report

- scrollUntilVisible:
    element:
      text: "Save to Files"
    direction: DOWN
    timeout: 20000
- tapOn: "Save to Files"
- runFlow:
    when:
      visible: ".*(Allow|ALLOW).*"
    commands:
      - tapOn: ".*(Allow|ALLOW).*"
# Asserted by its own text. A loose ".*OK.*" also matches a denial alert, which
# is how a refused save used to read as a pass in this suite.
- extendedWaitUntil:
    visible: "Saved!"
    timeout: 60000
- takeScreenshot: artifacts/android-04-saved
