name: Continuous Integration

# Runs on the self-hosted macOS runner the rest of the portfolio uses. A bundle export is the
# cheapest way to catch what a typecheck cannot: a Metro resolution error, a missing asset, or
# a config plugin that throws — all of which only appear when something actually builds.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Test & Bundle Verification
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test -- --ci

      - name: Validate Expo Configuration
        run: npx expo config --type public

      - name: Verify iOS Production Bundle Export
        run: npm run export:ios

      - name: Verify Android Production Bundle Export
        run: npm run export:android
